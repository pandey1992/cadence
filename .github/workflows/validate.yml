name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository structure
        run: python3 scripts/validate-repo.py
      - name: Check hook syntax
        run: bash -n plugins/cadence/hooks/pre-commit plugins/cadence/scripts/cadence-check.sh plugins/cadence/scripts/install-git-hook.sh
